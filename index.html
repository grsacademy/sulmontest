<!-- HTML 폼 부분 -->
<form id="surveyForm">
  <input type="text" name="name" placeholder="이름" required>
  <input type="text" name="phone" placeholder="연락처" required>
  <input type="text" name="course" placeholder="신청과정" required>
  <button type="submit">신청하기</button>
</form>

<script>
  const scriptURL = 'https://script.google.com/macros/s/AKfycbwT0BmyVlkg-SWOHm1ZUY7FY2DuQDi80y2UskG1hu8wTssCRSDr_ubIn4qb-ugr0kSX/exec';
  const form = document.getElementById('surveyForm');

  form.addEventListener('submit', e => {
    e.preventDefault();
    fetch(scriptURL, { method: 'POST', body: new FormData(form)})
      .then(response => alert("성공적으로 접수되었습니다!"))
      .catch(error => console.error('Error!', error.message));
  });
</script>
